name: Agent — Pipeline Health

# Manual-only until first autonomous runs are verified.
# Once the skill output is confirmed clean, uncomment the schedule
# block to run daily at 9 AM ET (after the 7 AM Apps Script data pull).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'  # 9 AM ET (UTC-4) / 8 AM ET during DST
permissions:
  contents: read
  # `claude-code-action@v1` fetches an OIDC token at startup for its
  # auth flow with the action's backend. Without `id-token: write` the
  # action fails before reaching the prompt with:
  #   "Could not fetch an OIDC token. Did you remember to add
  #    `id-token: write` to your workflow permissions?"
  # See claude.yml for the same pattern.
  id-token: write
  # Allows the "Post status to tracking issue" step to comment on
  # issue #48 via gh CLI + ${{ github.token }}.
  issues: write

concurrency:
  group: agent-pipeline-health
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Run pipeline-health skill via Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Same secret the daily-data workflow uses. The skill script
          # (scripts/check_health.py) reads it directly via os.environ.
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          # Optional. If unset, Claude will skip Slack posting and only
          # surface results in this workflow's logs.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Surface Claude's full output in the workflow log. Without
          # these, the action runs Claude silently and only saves the
          # transcript to /tmp — making failures impossible to diagnose
          # from the run page.
          show_full_output: "true"
          display_report: "true"
          # Without this, Claude runs in permissionMode:"default" and
          # auto-denies every Bash command (no human to approve in CI).
          # The workflow itself is the trust boundary — we control the
          # prompt, env, and dispatch — so bypassing per-command prompts
          # is appropriate. Verified necessary by the 5-permission-denial
          # transcript on the previous run.
          claude_args: "--permission-mode bypassPermissions"
          prompt: |
            Run the pipeline-health skill exactly as documented in
            skills/pipeline-health/SKILL.md.

            The script (skills/pipeline-health/scripts/check_health.py)
            handles the Sheet write itself — you only need to read its
            JSON output and compose the human-readable summary.

            Steps:
            1. Run `python3 skills/pipeline-health/scripts/check_health.py`.
            2. Parse the JSON it prints to stdout.
            3. Compose output per the rules below.

            Output rules:
            - If all four checks return PASS, print one line:
              "All checks PASS — pipeline healthy as of <date>."
              Do NOT post to Slack on full PASS (silent success — see
              SKILL.md "Constraints").
            - If any check is WARN or FAIL, print a multi-line summary:
              one line per non-PASS check using the `detail` string
              verbatim, FAIL listed before WARN. THEN, if the
              SLACK_WEBHOOK_URL env var is set and non-empty, POST the
              same plain-text summary to that webhook via curl.
            - If `sheet_write.posted` is `false` in the script output,
              surface that as its own WARN line — the historical log is
              broken even if the four checks ran.

            Constraints:
            - Read-only on the repo. Do not modify any files (except
              writing /tmp/agent_status.txt as noted below). Do not
              create branches or push commits.
            - Do not call the Meta API directly. The skill script handles
              that.
            - If the script exits non-zero, surface the stderr message
              and stop — that's a real problem the script's own error
              path already framed correctly.

            Status reporter:
            - Before exiting, write a single-line status to
              /tmp/agent_status.txt summarizing the result, e.g.:
                "PASS 4/0/0"  (data_freshness/meta_token/IC/dashboard counts)
                "WARN 3/1/0  meta_token expires in 12 days"
                "FAIL 2/0/2  dashboard_endpoint, data_freshness"
              Format: <overall> <pass>/<warn>/<fail>  <optional concise reason>
              The workflow's status reporter step will pick this up and
              post it to the agent-loop tracking issue.

      # Belt-and-suspenders: dump the action's saved transcript even if
      # show_full_output / display_report don't render it cleanly. Runs
      # on success or failure so we can diagnose either way.
      - name: Dump Claude execution log
        if: always()
        run: |
          LOG=/home/runner/work/_temp/claude-execution-output.json
          if [ -f "$LOG" ]; then
            echo "=== claude-execution-output.json ==="
            cat "$LOG"
          else
            echo "No claude-execution-output.json at $LOG"
            ls -la /home/runner/work/_temp/ || true
          fi

      # Post status to the agent-loop tracking issue (#48).
      - name: Post status to tracking issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          DETAIL="$(cat /tmp/agent_status.txt 2>/dev/null || echo '(no status file)')"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "**pipeline-health** — ${STATUS}"
            echo "$DETAIL"
            echo "[run]($RUN_URL)"
          } | gh issue comment 48 --repo "${{ github.repository }}" --body-file - || true
