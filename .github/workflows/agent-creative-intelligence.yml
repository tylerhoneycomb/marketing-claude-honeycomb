name: Agent — Creative Intelligence

on:
  workflow_dispatch:
  schedule:
    # Mon 14:00 UTC = 10 AM EDT (UTC-4, summer) / 9 AM EST (UTC-5, winter).
    - cron: '0 14 * * 1'

permissions:
  # `contents: write` lets the "Commit cache updates" step push the
  # refreshed creative cache + downloaded images + categorizations
  # back to main. Mirrors daily-data.yml, which has the same need.
  contents: write
  # Required by claude-code-action@v1 for OIDC auth at startup.
  id-token: write
  # Allows the "Post status to tracking issue" step to comment on
  # issue #48 via gh CLI + ${{ github.token }}.
  issues: write

concurrency:
  group: agent-creative-intelligence
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # First-run cost: ~$5 of Anthropic categorization (200-400 unique
    # text variants + 50-150 unique images on Sonnet 4.5) plus the
    # 30-day snapshot aggregation + creative cache refresh + image
    # download. Subsequent runs are minutes (cache hits).
    #
    # Architecture: scripts run as ordinary workflow steps BEFORE
    # claude-code-action is invoked. The first attempt at this skill
    # ran the scripts inside the action's Bash prompt; the
    # categorizer's Anthropic SDK calls all failed with
    # APIConnectionError, suspected cause being claude-code-action's
    # subprocess inheriting wrapped HTTP env vars (likely
    # ANTHROPIC_BASE_URL or a proxy) that broke direct SDK
    # connections. Running the scripts as separate workflow steps
    # uses the runner's normal env, which works for both Meta calls
    # and Anthropic calls.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # `anthropic` is for the variant categorizer; only this skill
        # needs it, so the dep stays scoped to this workflow rather
        # than added repo-wide.
        run: pip install requests==2.32.3 anthropic==0.98.1

      # Step 1: refresh the creative cache + build the variant corpus.
      # Hits Meta (cache refresh + /adimages resolution + image
      # downloads). On first run this is the slowest step (~5-10 min);
      # subsequent runs hit the cache and complete in <30 seconds.
      - name: Build creative dataset (initial pass)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          python3 skills/creative-intelligence/scripts/build_creative_dataset.py \
            --output /tmp/creative_dataset.json

      # Step 2: LLM categorize any new variants/images. Hits Anthropic
      # API once per unique variant text + image. Hash-deduped via the
      # categorizations.json cache so subsequent runs only categorize
      # genuinely new content. continue-on-error so a Connection
      # blip doesn't kill the brief — the dataset still has raw text
      # + structural features which Tyler's reframe identified as the
      # primary signal anyway. The brief notes when tags are absent.
      - name: Categorize variants + images
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 skills/creative-intelligence/scripts/categorize_creative.py

      # Step 3: re-emit the dataset with LLM tags now attached. If
      # categorize succeeded this adds llm_copy_angle and
      # llm_visual_style decorations; if it failed this is a no-op
      # re-emit (cache is fresh from step 1, no Meta calls).
      - name: Re-build dataset with LLM tags
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          python3 skills/creative-intelligence/scripts/build_creative_dataset.py \
            --output /tmp/creative_dataset.json

      # Step 4: Claude composes the brief from the dataset + cached
      # images, POSTs per-vertical rollups to the Sheet, optionally
      # Slack-posts a condensed version, writes the status one-liner.
      # NO scripts run here — that's the whole point of the
      # restructure. Claude only does brief composition + comms.
      - name: Compose brief via Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Optional. If unset, Claude skips Slack posting and only
          # surfaces results in this workflow's logs.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: "true"
          display_report: "true"
          claude_args: "--permission-mode bypassPermissions"
          prompt: |
            Compose the Creative Intelligence brief per
            skills/creative-intelligence/SKILL.md.

            The dataset builder and categorizer have already run as
            previous workflow steps. /tmp/creative_dataset.json is on
            disk with raw text + structural features + (when
            available) LLM tags. Cached images are at
            data/creatives/images/<image_hash>.jpg. Do NOT re-run the
            scripts — read the dataset directly.

            Steps:
            1. Read /tmp/creative_dataset.json. If the variants[]
               array has llm_copy_angle: null on every entry, the
               categorizer step failed (check its log) — compose the
               brief from raw text + structural features only and
               note the missing tags in the status one-liner.
            2. Compose the brief following the output rules in
               SKILL.md.
            3. POST the per-vertical Sheet rows to
               `?action=creative-intelligence-write`. The endpoint URL
               is in data/config/benchmarks.json under exec_endpoint.
            4. If `SLACK_WEBHOOK_URL` env var is set and non-empty,
               POST a condensed brief to that webhook via curl. Skip
               Slack silently if unset.
            5. Write the status one-liner to /tmp/agent_status.txt.

            Output rules — MUST follow:
            - Always quote actual ad copy in the brief, never just
              recommend a category. A finding that says "lead with
              owner_story angle" is a failure; the right shape is
              "lead with bodies like 'Sarah's been brewing for 12
              years' (4 ads, 18 IC, $42 CPICP)."
            - Always cite real numbers from /tmp/creative_dataset.json.
              Do not invent numbers. If a variant has cpicp=null
              (no IC conversions yet), say so explicitly.
            - Honor confidence labels: confident (≥10 ads + ≥25 IC),
              directional (≥5 + ≥10), insufficient (below). Don't
              recommend acting on insufficient findings; frame them
              as hypotheses to test.
            - Group findings by vertical, lead each section with
              the actionable insight, and back it with 2-3 quoted
              copy examples + their numbers.
            - Include side-by-side findings prominently — these are
              the cleanest causal signal in the dataset.

            Constraints:
            - Read-only on the repo (except writing
              /tmp/agent_status.txt). Do not modify any source files.
              Do not push commits.
            - Do not run the dataset builder or categorizer — the
              workflow has already run them. Do not call Meta or
              Anthropic directly; both have been called by the
              previous steps.

            Status reporter:
            - Before exiting, write a single-line status to
              /tmp/agent_status.txt, e.g.:
                "verticals=8 variants=247 confident=2 directional=4 insufficient=2 winners_top=owner_story bottom_decile_count=14"
                "verticals=15 variants=426 confident=1 directional=3 insufficient=11 note=categorize_failed_no_llm_tags"
              The workflow's status reporter step picks this up and
              posts it to the agent-loop tracking issue (#48).

      - name: Dump Claude execution log
        if: always()
        run: |
          LOG=/home/runner/work/_temp/claude-execution-output.json
          if [ -f "$LOG" ]; then
            echo "=== claude-execution-output.json ==="
            cat "$LOG"
          else
            echo "No claude-execution-output.json at $LOG"
            ls -la /home/runner/work/_temp/ || true
          fi

      # Commit any new image downloads, creative cache updates, and
      # categorization cache entries so subsequent runs skip the
      # expensive first-time work. Mirrors daily-data.yml's commit
      # step including the 4-attempt push retry — a transient push
      # failure shouldn't lose a cache full of expensive
      # categorizations.
      - name: Commit cache updates
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/creatives/
          if git diff --cached --quiet; then
            echo "no cache changes to commit"
            exit 0
          fi
          git commit -m "agent-creative-intelligence: cache refresh $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            sleep $((2 ** i))
          done
          echo "git push failed after 4 attempts"
          exit 1

      # Post status to the agent-loop tracking issue (#48).
      - name: Post status to tracking issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          DETAIL="$(cat /tmp/agent_status.txt 2>/dev/null || echo '(no status file)')"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "**creative-intelligence** — ${STATUS}"
            echo "$DETAIL"
            echo "[run]($RUN_URL)"
          } | gh issue comment 48 --repo "${{ github.repository }}" --body-file - || true
