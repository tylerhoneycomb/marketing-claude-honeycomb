name: Agent — Creative Intelligence

on:
  workflow_dispatch:
  schedule:
    # Mon 14:00 UTC = 10 AM EDT (UTC-4, summer) / 9 AM EST (UTC-5, winter).
    - cron: '0 14 * * 1'

permissions:
  # `contents: write` lets the "Commit cache updates" step push the
  # refreshed creative cache + downloaded images + categorizations
  # back to main. Mirrors daily-data.yml, which has the same need.
  contents: write
  # Required by claude-code-action@v1 for OIDC auth at startup.
  id-token: write
  # Allows the "Post status to tracking issue" step to comment on
  # issue #48 via gh CLI + ${{ github.token }}.
  issues: write

concurrency:
  group: agent-creative-intelligence
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # First-run cost: ~$5 of Anthropic categorization (200-400 unique
    # text variants + 50-150 unique images on Sonnet 4.5) plus the
    # 30-day snapshot aggregation + creative cache refresh + image
    # download. Subsequent runs are minutes (cache hits).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # `anthropic` is for the variant categorizer; only this skill
        # needs it, so the dep stays scoped to this workflow rather
        # than added repo-wide.
        run: pip install requests==2.32.3 anthropic==0.98.1

      - name: Run creative-intelligence skill via Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Same secret the daily-data + other agent workflows use.
          # The skill scripts read it directly via os.environ.
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          # Required: the categorizer's Anthropic SDK reads this from
          # env. Same key claude-code-action uses for its own runtime.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional. If unset, Claude skips Slack posting and only
          # surfaces results in this workflow's logs.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: "true"
          display_report: "true"
          claude_args: "--permission-mode bypassPermissions"
          prompt: |
            Run the creative-intelligence skill exactly as documented
            in skills/creative-intelligence/SKILL.md.

            Three script invocations in sequence. build runs FIRST so
            the creative cache is fully refreshed (asset_feed_spec
            arrays + image_hashes populated for every active creative),
            then categorize tags any new variants/images, then build
            re-runs to re-emit the dataset JSON with the new tags
            attached. The second build call is essentially free
            (cache + images already on disk; just re-emits the JSON).

            Steps:
            1. `python3 skills/creative-intelligence/scripts/build_creative_dataset.py --output /tmp/creative_dataset.json`
               — refreshes the creative cache from Meta, resolves +
               downloads any new images, builds the variant corpus.
            2. `python3 skills/creative-intelligence/scripts/categorize_creative.py`
               — calls the Anthropic API for any new variants/images,
               persists tags into data/creatives/categorizations.json.
            3. `python3 skills/creative-intelligence/scripts/build_creative_dataset.py --output /tmp/creative_dataset.json`
               — re-emits the dataset with the now-cached tags
               attached. Required so /tmp/creative_dataset.json has
               LLM tags from the first run onward.
            4. Read /tmp/creative_dataset.json. Compose the brief
               following the output rules in SKILL.md.
            5. POST the per-vertical Sheet rows to
               `?action=creative-intelligence-write`. The endpoint URL
               is in data/config/benchmarks.json under exec_endpoint
               (or in the EXEC_ENDPOINT env var).
            6. If `SLACK_WEBHOOK_URL` env var is set and non-empty,
               POST a condensed brief to that webhook via curl. Skip
               Slack silently if unset.
            7. Write the status one-liner to /tmp/agent_status.txt
               (see SKILL.md "Status reporter" section for the exact
               format).

            Output rules — MUST follow:
            - Always quote actual ad copy in the brief, never just
              recommend a category. A finding that says "lead with
              owner_story angle" is a failure; the right shape is
              "lead with bodies like 'Sarah's been brewing for 12
              years' (4 ads, 18 IC, $42 CPICP)."
            - Always cite real numbers from /tmp/creative_dataset.json.
              Do not invent numbers. If a variant has cpicp=null
              (no IC conversions yet), say so explicitly.
            - Honor confidence labels: confident (≥10 ads + ≥25 IC),
              directional (≥5 + ≥10), insufficient (below). Don't
              recommend acting on insufficient findings; frame them
              as hypotheses to test.
            - Group findings by vertical, lead each section with
              the actionable insight, and back it with 2-3 quoted
              copy examples + their numbers.
            - Include side-by-side findings prominently — these are
              the cleanest causal signal in the dataset.

            Constraints:
            - Read-only on Meta and the repo (except writing
              /tmp/agent_status.txt and /tmp/creative_dataset.json).
              Do not modify any source files. Do not push commits.
            - Do not call the Meta API directly outside the scripts.
              build_creative_dataset.py owns all Meta calls including
              the creative cache refresh, the /adimages resolution,
              and the image downloads.
            - If either script exits non-zero, surface the stderr
              message, write a status one-liner indicating the
              failure, and stop. Do not attempt to compose a brief
              from incomplete data.

            Status reporter:
            - Before exiting, write a single-line status to
              /tmp/agent_status.txt, e.g.:
                "verticals=8 variants=247 confident=2 directional=4 insufficient=2 winners_top=owner_story bottom_decile_count=14"
                "ERROR: build_creative_dataset.py exited non-zero — see workflow log"
              The workflow's status reporter step picks this up and
              posts it to the agent-loop tracking issue (#48).

      - name: Dump Claude execution log
        if: always()
        run: |
          LOG=/home/runner/work/_temp/claude-execution-output.json
          if [ -f "$LOG" ]; then
            echo "=== claude-execution-output.json ==="
            cat "$LOG"
          else
            echo "No claude-execution-output.json at $LOG"
            ls -la /home/runner/work/_temp/ || true
          fi

      # Commit any new image downloads, creative cache updates, and
      # categorization cache entries so subsequent runs skip the
      # expensive first-time work. Mirrors daily-data.yml's commit
      # step including the 4-attempt push retry — a transient push
      # failure shouldn't lose a cache full of expensive
      # categorizations.
      - name: Commit cache updates
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/creatives/
          if git diff --cached --quiet; then
            echo "no cache changes to commit"
            exit 0
          fi
          git commit -m "agent-creative-intelligence: cache refresh $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            sleep $((2 ** i))
          done
          echo "git push failed after 4 attempts"
          exit 1

      # Post status to the agent-loop tracking issue (#48).
      - name: Post status to tracking issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          DETAIL="$(cat /tmp/agent_status.txt 2>/dev/null || echo '(no status file)')"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "**creative-intelligence** — ${STATUS}"
            echo "$DETAIL"
            echo "[run]($RUN_URL)"
          } | gh issue comment 48 --repo "${{ github.repository }}" --body-file - || true
