name: Daily Ad Data Collection

# Daily 8 AM ET cron + workflow_dispatch for manual backfills.
# After 2026-05-03, autonomous mode: runs daily and commits the snapshot
# directly to main. Manual dispatch is preserved for backfills via the
# start_date / end_date inputs.
on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: 'Single-day snapshot date YYYY-MM-DD (blank = yesterday UTC). Ignored if start_date+end_date are set.'
        required: false
        default: ''
      start_date:
        description: 'Backfill range START YYYY-MM-DD (inclusive). Pair with end_date.'
        required: false
        default: ''
      end_date:
        description: 'Backfill range END YYYY-MM-DD (inclusive). Pair with start_date.'
        required: false
        default: ''
      sleep_between_calls:
        description: 'Min seconds between Meta API calls (rate limiting).'
        required: false
        default: '1.0'
  schedule:
    - cron: '0 12 * * *'  # 8 AM ET (UTC-4) / 7 AM ET during DST

permissions:
  contents: write
  # Allows the "Post status to tracking issue" step to comment on
  # issue #48 via gh CLI + ${{ github.token }}.
  issues: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  fetch-and-compute:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Fetch ad-level data from Meta
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SNAPSHOT_DATE: ${{ github.event.inputs.snapshot_date }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          SLEEP_BETWEEN: ${{ github.event.inputs.sleep_between_calls }}
        run: |
          set -e
          SLEEP_ARG="--sleep ${SLEEP_BETWEEN:-1.0}"
          if [ -n "$START_DATE" ] && [ -n "$END_DATE" ]; then
            echo "Backfill mode: $START_DATE → $END_DATE"
            python scripts/fetch_ad_data.py --start "$START_DATE" --end "$END_DATE" $SLEEP_ARG
          else
            python scripts/fetch_ad_data.py $SLEEP_ARG
          fi

      - name: Compute derived signals
        run: python scripts/compute_signals.py

      - name: Commit snapshots
        env:
          SNAPSHOT_DATE: ${{ github.event.inputs.snapshot_date }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/derived data/creatives
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          if [ -n "$START_DATE" ] && [ -n "$END_DATE" ]; then
            COMMIT_MSG="data: ad-level backfill ${START_DATE} → ${END_DATE}"
          else
            DATE_LABEL="${SNAPSHOT_DATE:-$(date -u -d 'yesterday' +%Y-%m-%d)}"
            COMMIT_MSG="data: ad-level snapshot ${DATE_LABEL}"
          fi
          git commit -m "$COMMIT_MSG"
          # fetch+rebase before each push retry handles main moving
          # during the run (when scheduled cron coincides with a PR
          # merge). The naive retry-same-push pattern silently
          # failed on 2026-05-05 when the agent-creative-intelligence
          # run pushed back ~10 minutes after Tyler merged a chain
          # of PRs.
          for i in 1 2 3 4; do
            if git fetch origin main \
               && git rebase origin/main \
               && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((2 ** i))
          done
          echo "git push failed after 4 attempts"
          exit 1

      # ── Pipeline health check ────────────────────────────────────
      # Folded in 2026-06-23 from the retired agent-pipeline-health.yml
      # workflow, which fired claude-code-action (an Anthropic-billed
      # LLM agent) daily just to reformat deterministic JSON. check_health.py
      # is fully self-contained: it runs the four checks (data freshness,
      # Meta token, IC conversion event, dashboard endpoint), writes the
      # pipeline_health Sheet rows itself, and prints JSON. report_health.py
      # then composes the terminal summary, POSTs the Slack alert on
      # WARN/FAIL (silent on full PASS, skipped if no webhook), and writes
      # the one-line status for the issue-#48 comment. No LLM, no OIDC.
      #
      # `if: always()` so health is reported even when the fetch above
      # failed — a stale/broken pull is exactly when you want the check.
      # The health check targets the campaign-level rolling_data + Meta +
      # dashboard endpoint, independent of this job's ad-level snapshot,
      # so it's valid regardless of the fetch outcome.
      - name: Run pipeline-health checks
        if: always()
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          # Optional. If unset, report_health.py prints to the log only.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set +e
          python3 skills/pipeline-health/scripts/check_health.py > /tmp/health.json
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "check_health.py exited $RC"
            cat /tmp/health.json || true
            echo "FAIL — check_health.py exited $RC (see workflow log)" > /tmp/health_status.txt
            exit 0   # never fail the data-pull job over the health reporter
          fi
          python3 skills/pipeline-health/scripts/report_health.py \
            --input /tmp/health.json --status-file /tmp/health_status.txt

      # Post status to the agent-loop tracking issue (#48). continue-on-error
      # so a closed/missing issue doesn't fail the run. if: always() so we
      # report failures too.
      - name: Post status to tracking issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          SNAPSHOT_DATE_INPUT: ${{ github.event.inputs.snapshot_date }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          set +e
          DETAIL=""
          if [ -n "$START_DATE" ] && [ -n "$END_DATE" ]; then
            # Backfill mode: sum counts across all per-date manifests
            # that landed in the range. The previous logic read only
            # the "yesterday UTC" manifest, which is the wrong date
            # for a backfill range and often didn't exist at all.
            TOTAL_DAYS=0
            CAMPAIGNS=0; ADSETS=0; ADS=0; AD_INS=0
            for MANIFEST in data/snapshots/*/. ; do :; done  # noop loop to keep set +e clean
            for MANIFEST in $(ls -1 data/snapshots/*/_manifest.json 2>/dev/null); do
              D=$(basename "$(dirname "$MANIFEST")")
              if [[ "$D" < "$START_DATE" || "$D" > "$END_DATE" ]]; then continue; fi
              TOTAL_DAYS=$((TOTAL_DAYS + 1))
              CAMPAIGNS=$((CAMPAIGNS + $(jq -r '.counts.campaigns // 0' "$MANIFEST")))
              ADSETS=$((ADSETS + $(jq -r '.counts.adsets // 0' "$MANIFEST")))
              ADS=$((ADS + $(jq -r '.counts.ads // 0' "$MANIFEST")))
              AD_INS=$((AD_INS + $(jq -r '.counts.ad_insights // 0' "$MANIFEST")))
            done
            DETAIL="days=${TOTAL_DAYS} campaigns_sum=${CAMPAIGNS} adsets_sum=${ADSETS} ads_sum=${ADS} ad_insights_sum=${AD_INS}"
            HEADER="**daily-data** (backfill ${START_DATE} → ${END_DATE}) — ${STATUS}"
          else
            DATE_LABEL="${SNAPSHOT_DATE_INPUT:-$(date -u -d 'yesterday' +%Y-%m-%d)}"
            MANIFEST="data/snapshots/${DATE_LABEL}/_manifest.json"
            if [ -f "$MANIFEST" ]; then
              DETAIL="$(jq -r '"campaigns=\(.counts.campaigns // 0) adsets=\(.counts.adsets // 0) ads=\(.counts.ads // 0) ad_insights=\(.counts.ad_insights // 0)"' "$MANIFEST")"
            fi
            HEADER="**daily-data** (${DATE_LABEL}) — ${STATUS}"
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "$HEADER"
            echo "$DETAIL"
            echo "[run]($RUN_URL)"
          } | gh issue comment 48 --repo "${{ github.repository }}" --body-file - || true

      # Post the pipeline-health result as its own issue-#48 comment so the
      # chronological agent-loop log keeps a distinct "pipeline-health" entry,
      # exactly as it had when pipeline-health was a standalone workflow.
      - name: Post pipeline-health status to tracking issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          DETAIL="$(cat /tmp/health_status.txt 2>/dev/null || echo '(no status file)')"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "**pipeline-health** — ${STATUS}"
            echo "$DETAIL"
            echo "[run]($RUN_URL)"
          } | gh issue comment 48 --repo "${{ github.repository }}" --body-file - || true
