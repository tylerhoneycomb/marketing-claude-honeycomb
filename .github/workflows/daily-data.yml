name: Daily Ad Data Collection

# This workflow is currently MANUAL-ONLY (workflow_dispatch).
# Once we've verified the snapshot output is correct, uncomment the
# `schedule` block below to enable the daily 8 AM ET (12:00 UTC) run.
on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: 'Snapshot date YYYY-MM-DD (blank = yesterday UTC)'
        required: false
        default: ''
  # schedule:
  #   - cron: '0 12 * * *'  # 8 AM ET (UTC-4) / 7 AM ET during DST

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  fetch-and-compute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Fetch ad-level data from Meta
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          SNAPSHOT_DATE: ${{ github.event.inputs.snapshot_date }}
        run: python scripts/fetch_ad_data.py

      - name: Compute derived signals
        run: python scripts/compute_signals.py

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/derived data/creatives
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE_LABEL="${SNAPSHOT_DATE:-$(date -u -d 'yesterday' +%Y-%m-%d)}"
          git commit -m "data: ad-level snapshot ${DATE_LABEL}"
          for i in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            sleep $((2 ** i))
          done
          echo "git push failed after 4 attempts"
          exit 1
        env:
          SNAPSHOT_DATE: ${{ github.event.inputs.snapshot_date }}
