name: Agent — Fatigue Monitor

# PAUSED 2026-06-10 — Slack briefings disabled at the user's request.
# To re-enable:
#   1. Restore the `schedule:` block below (the cron entry is preserved
#      as a comment so the original timing is obvious).
#   2. Remove the early-return guard in
#      `triggerAgentFatigueMonitorIfNeeded()` in apps-script/Code.js.
# Manual `workflow_dispatch` is still available while paused.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '30 13 * * 1,4'  # Mon + Thu 9:30 AM ET (UTC-4) / 8:30 AM ET during DST

permissions:
  contents: read
  # Required by claude-code-action@v1 for OIDC auth at startup.
  id-token: write
  # Allows the "Post status to tracking issue" step to comment on
  # issue #48 via gh CLI + ${{ github.token }}.
  issues: write

concurrency:
  group: agent-fatigue-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 14-day fetch + per-creative metadata + Path-B historical query
    # + classification across N ads. First run is the slowest because
    # the creative cache is empty.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Run fatigue-monitor skill via Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Same secret the daily-data + other agent workflows use.
          # The skill scripts read it directly via os.environ.
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          EXEC_SHARED_SECRET: ${{ secrets.EXEC_SHARED_SECRET }}
          # Optional. If unset, Claude skips Slack posting and only
          # surfaces results in this workflow's logs.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: "true"
          display_report: "true"
          claude_args: "--permission-mode bypassPermissions"
          prompt: |
            Run the fatigue-monitor skill exactly as documented in
            skills/fatigue-monitor/SKILL.md.

            Three scripts run in sequence. classify_fatigue.py handles
            the Sheet write AND the budget-conflict cross-reference —
            you only read its JSON and compose the human-readable
            summary.

            Steps:
            1. `python3 skills/fatigue-monitor/scripts/fetch_fatigue_data.py > /tmp/fatigue_fetch.json`
            2. `python3 skills/fatigue-monitor/scripts/compute_baselines.py --input /tmp/fatigue_fetch.json > /tmp/fatigue_baselines.json`
            3. `python3 skills/fatigue-monitor/scripts/classify_fatigue.py --fetch /tmp/fatigue_fetch.json --baselines /tmp/fatigue_baselines.json`
            4. Parse classify_fatigue.py's stdout JSON.
            5. Compose output per the rules below.

            Output rules (leads and CPL are the headline; CTR / freq /
            CPC are diagnostics that explain why leads got expensive):
            - Headline line first:
                "🔥 Fatigue Monitor — <date> — <stats.non_healthy> ads
                 at risk · $<stats.spend_7d> spend / <stats.leads_7d>
                 leads (CPL $<stats.cpl_7d>) last 7d"
              plus " · <N> budget conflicts" when
              stats.pending_increases_with_conflict > 0.
            - Then non-healthy ads grouped by severity, in the order
              `classifications` already has them (it is pre-sorted:
              FATIGUED, EARLY FATIGUE, SATURATED, UNDERPERFORMING;
              within a section conflicts first, then zero-lead
              spenders, then CPL descending). Do not re-sort. Skip
              `healthy` entirely.
              For each ad:
                1. name (campaign)
                2. lead line FIRST: "Leads 7d: <leads_current>
                   (CPL $<cpl_baseline> → $<cpl_current>,
                   ↑<cpl_change_pct>%) | spend $<spend_current>".
                   Use "0 leads on $<spend_current> spend" when
                   leads_current == 0; drop the arrow/percent when
                   cpl_change_pct is null. Append
                   " · vs $<stats.target_cpl_dollars> target" when
                   cpl_current exceeds stats.target_cpl_dollars.
                3. diagnostics: CTR baseline → current with decline %,
                   frequency, CPC change. Append "(estimated
                   baseline)" if baseline_type == "estimated".
                4. days_active + headline preview if available.
                5. ONLY when ic_current > 0, a secondary line:
                   "of which <ic_current> reached an IC decision".
                   Never put IC in the headline, a sort, or a title.
                6. If `budget_conflict` is non-null, render it
                   verbatim as a ⚠️ line under that ad — that's the
                   most actionable signal in the report.
            - All-healthy condition is "no non-healthy classifications"
              (stats.non_healthy == 0 — `classifications` still lists
              the healthy ads, so do NOT test for an empty list). In
              that case replace the non-healthy section with one line:
                "No fatigue signals — <ads_evaluated> ads evaluated,
                 $<spend_7d> spend / <leads_7d> leads (CPL $<cpl_7d>)
                 in the last 7d, all healthy."
              If stats.ads_evaluated is 0, say "No ads passed the
              eligibility gates — see stats.skipped." instead.
            - End the terminal output with: "Sheet log: N rows written
              to fatigue_log" and a one-liner of
              stats.by_classification counts.
            - If `sheet_write.posted` is false in the classify output,
              surface that as a separate WARN line with
              sheet_write.error (terminal / workflow log only).
            - If `SLACK_WEBHOOK_URL` env var is set and non-empty,
              POST to that webhook via curl ONLY the headline line
              plus the non-healthy section (or the all-healthy
              one-liner in its place). The "Sheet log" trailer, the
              by_classification counts and any WARN line are NOT
              part of the Slack body. If unset or empty, skip Slack
              silently.

            Constraints:
            - Read-only on the repo. Do not modify any files (except
              writing /tmp/agent_status.txt as noted below). Do not
              create branches or push commits.
            - Do not call the Meta API directly. The fetch and baseline
              scripts handle all Meta queries (including the Path-B
              historical baseline batch).
            - If any script exits non-zero, surface the stderr message
              and stop.

            Status reporter:
            - Before exiting, write a single-line status to
              /tmp/agent_status.txt, e.g.:
                "evaluated=12 fatigued=2 early_fatigue=1 saturated=0 underperforming=0 healthy=9 conflicts=1"
                "evaluated=15 healthy=15 conflicts=0  (no fatigue signals)"
              Pull the values from classify_fatigue.py JSON:
              stats.ads_evaluated, stats.by_classification.{fatigued,
              early_fatigue, saturated, underperforming, healthy},
              stats.pending_increases_with_conflict.
              The workflow's status reporter step picks this up and posts
              it to the agent-loop tracking issue.

      - name: Dump Claude execution log
        if: always()
        run: |
          LOG=/home/runner/work/_temp/claude-execution-output.json
          if [ -f "$LOG" ]; then
            echo "=== claude-execution-output.json ==="
            cat "$LOG"
          else
            echo "No claude-execution-output.json at $LOG"
            ls -la /home/runner/work/_temp/ || true
          fi

      # Post status to the agent-loop tracking issue (#48).
      - name: Post status to tracking issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          DETAIL="$(cat /tmp/agent_status.txt 2>/dev/null || echo '(no status file)')"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "**fatigue-monitor** — ${STATUS}"
            echo "$DETAIL"
            echo "[run]($RUN_URL)"
          } | gh issue comment 48 --repo "${{ github.repository }}" --body-file - || true
