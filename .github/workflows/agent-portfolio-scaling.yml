name: Agent — Portfolio Scaling

on:
  workflow_dispatch:
  schedule:
    # Tuesdays, off the top/half of the hour to dodge GitHub's
    # scheduled-run queue contention (worst at :00, also heavy at :30).
    # 13:43 UTC = 9:43 AM ET in EDT (summer, UTC-4) / 8:43 AM ET in EST
    # (winter, UTC-5). The brief is diagnosis-only since 2026-09-15 —
    # nothing to approve, and executeStrategicChanges in Code.js is
    # guarded off, so no Wednesday execution pairs with this run.
    - cron: '43 13 * * 2'

permissions:
  # `contents: write` lets the "Commit derived data" step push the
  # newly-computed scaling_profiles.json back to main. Same pattern as
  # agent-creative-intelligence.yml.
  contents: write
  # Required by claude-code-action@v1 for OIDC auth at startup.
  id-token: write
  # Allows the "Post status to tracking issue" step to comment on
  # issue #48 via gh CLI + ${{ github.token }}.
  issues: write

concurrency:
  group: agent-portfolio-scaling
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # No Anthropic spend in the Python steps (this skill is structural
    # math, not LLM categorization). Anthropic is only called inside
    # claude-code-action for the brief composition. Cheap run overall.
    #
    # Architecture: scripts run as ordinary workflow steps BEFORE
    # claude-code-action is invoked. See CLAUDE.md §"New-skill
    # architectural pattern" — the Anthropic SDK fails inside
    # claude-code-action's Bash subprocess, and commits after the
    # action lose their git auth credentials. Both lessons baked in here.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests==2.32.3

      # Step 1: structural diagnoses per vertical. Reads weekly_rollup +
      # snapshots + Meta API + executed budget_queue history; writes
      # data/derived/scaling_profiles.json. Cheap (one Meta call
      # batch + sheet reads).
      - name: Compute scaling profiles
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          EXEC_SHARED_SECRET: ${{ secrets.EXEC_SHARED_SECRET }}
        run: |
          python3 skills/portfolio-scaling/scripts/compute_scaling_profiles.py

      # Reallocation RETIRED 2026-09-15 at Tyler's request. The
      # `Compute reallocation` step (compute_reallocation.py --write-log)
      # used to run here: it sized a budget pool, registered a proposal
      # via scaling-queue-write, and wrote per-vertical rows to the
      # scaling_log Sheet tab. The brief is now diagnosis-only, so none
      # of that runs. compute_reallocation.py is kept on disk, unwired,
      # so the pool maths can be revived without rewriting it.
      #
      # The scaling_log Sheet rows stop with it. The weekly classification
      # record lives in git instead: data/derived/scaling_profiles.json is
      # committed on every run, so `git log` on that file is the history.
      #
      # Step 2: commit BEFORE claude-code-action. The action strips git
      # auth credentials in some way (the persisted http extraheader
      # from actions/checkout disappears) — pushes after fail with
      # "Password authentication is not supported." Commit while we
      # still have valid checkout credentials. Same fix as
      # agent-creative-intelligence.yml.
      #
      # Status marker goes to /tmp/data_commit_status.txt (separate
      # from /tmp/agent_status.txt) so Claude's brief composition
      # can't accidentally overwrite the commit outcome.
      - name: Commit derived data
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/derived/scaling_profiles.json
          if git diff --cached --quiet; then
            echo "no derived data changes to commit"
            echo "data_commit=no_changes" > /tmp/data_commit_status.txt
            exit 0
          fi
          git commit -m "agent-portfolio-scaling: weekly run $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            if git fetch origin main \
               && git rebase origin/main \
               && git push; then
              echo "data_commit=ok" > /tmp/data_commit_status.txt
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((2 ** i))
          done
          echo "git push failed after 4 attempts"
          echo "data_commit=push_failed" > /tmp/data_commit_status.txt
          exit 1

      # Step 3: Claude composes the two-section, leads-first Slack
      # brief from the committed JSON and posts it. Since 2026-09-15
      # the brief proposes nothing and writes nothing: it needs no
      # EXEC_SHARED_SECRET because it makes no side-effecting /exec
      # call, and there are no approve/reject links to embed.
      - name: Compose brief via Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Optional. Without it, Claude logs the composed brief but
          # skips the Slack POST.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: "true"
          display_report: "true"
          claude_args: "--permission-mode bypassPermissions"
          prompt: |
            Compose the Portfolio Scaling weekly brief per
            skills/portfolio-scaling/SKILL.md.

            The structural-diagnosis script has already run as a
            previous workflow step and its JSON is committed to main.
            data/derived/scaling_profiles.json is on disk. Do NOT
            re-run it — read the JSON directly.

            This brief is DIAGNOSIS ONLY (since 2026-09-15). It
            proposes no budget moves, registers nothing, and has no
            approval links. Do not POST to any /exec action. Do not
            read or mention data/derived/reallocation.json even if an
            old copy is still on disk.

            Steps:
            1. Read data/derived/scaling_profiles.json.
            2. Compose the two-section Slack brief described below.
            3. POST it to SLACK_WEBHOOK_URL via curl. Skip Slack
               silently if SLACK_WEBHOOK_URL is unset or empty.
            4. Write the status one-liner to /tmp/agent_status.txt.

            Output rules — MUST follow:
            - Title the message "*Honeycomb Scaling — <date>*" and
              open with one portfolio line built from
              portfolio.total_leads / total_spend / cpl:
              "Portfolio (12w): N leads · $S spend · CPL $X".
              Follow it with the live-spend line from
              portfolio.current_total_daily_cents and
              .active_campaign_count: "Active portfolio: $D/day
              ($W/wk) across N ACTIVE campaign(s)." Never add
              portfolio.paused_total_daily_cents to that figure.
            - EVERY vertical in `verticals` has at least one ACTIVE
              campaign — the script already filtered it. Render every
              key in `verticals` and NOTHING else. The
              `inactive_verticals` key holds retired verticals whose
              campaigns are all paused: never read it, never render
              it, never mention that it exists. Do not name, count or
              allude to a paused campaign or a retired vertical
              anywhere in the brief.
            - Belt and braces: independently skip any vertical whose
              `active_campaign_count` is 0 or missing, even if it
              appears under `verticals`. A JSON file written before
              2026-09-15 has the pre-split shape and carries paused
              verticals there; this rule keeps a stale file from
              putting them back in the brief.
            - Leads and CPL lead every line. Each vertical line opens
              with CPL and lead count (verticals[v].cpl,
              .total_conversions, .total_spend). Sort by CPL
              ascending within class.
            - The brief carries leads, CPL, spend and delivery
              diagnostics (frequency, CPM, elasticity) only. Any
              other JSON field is NEVER rendered — not as a headline,
              secondary line, parenthetical or trailing token — and
              never used for ordering or emphasis.
            - If cpl is null for a vertical, print "CPL —" and list
              it last within its group; never substitute another
              cost figure.
            - Cite real numbers from the JSON. Don't invent or round
              imprecisely.

            Section 1 — Scaling labels:
            - One line per vertical in `verticals`, CPL ascending
              within class, in the shape the SKILL.md example shows:
              classification, confidence tag when `directional`, CPL
              on leads / spend, elasticity r, spend share, frequency
              and CPM trend.
            - A vertical whose `classification` is `insufficient`
              prints as a "too new to classify — CPL $X on N leads
              (k weeks, j active campaign(s))" one-liner after the
              classified list. These are live campaigns with too
              little history to judge, not a problem to flag.
            - If `verticals` is empty, say so in one line ("No ACTIVE
              campaigns to report this week.") and skip to section 2.

            Section 2 — Audience actions:
            - For each vertical in `verticals` with
              new_audience_needed true, one line: the diagnosis opens
              "CPL $X on N leads (12w)", then the action "duplicate
              ad set with broader targeting", then frequency and CPM
              trend as the evidence.
            - Skip the whole section when no vertical qualifies.

            Constraints:
            - Read-only on the repo. Do not modify any source files.
              Do not push commits — the commit step already ran.
            - Do not run the Python scripts — the workflow has
              already run them.
            - Do not call Meta directly. The Python script already
              made all needed Meta calls.
            - Never propose, imply or invite a budget change, and
              never write an approve/reject URL. There is no approval
              flow for this brief any more.

            Status reporter:
            - Before exiting, write a single-line status to
              /tmp/agent_status.txt, e.g.:
                "leads=1240 cpl=$14.19 verticals=2 scalable=0 saturating=0 over_invested=0 insufficient=2 new_audience_needed=0 diagnosis_only"
              leads / cpl are portfolio.total_leads / portfolio.cpl
              from scaling_profiles.json (12-week); `verticals` is the
              count of ACTIVE verticals rendered.
              The workflow's status reporter step picks this up and
              posts it to issue #48 alongside the data_commit marker.


      - name: Dump Claude execution log
        if: always()
        run: |
          LOG=/home/runner/work/_temp/claude-execution-output.json
          if [ -f "$LOG" ]; then
            echo "=== claude-execution-output.json ==="
            cat "$LOG"
          else
            echo "No claude-execution-output.json at $LOG"
            ls -la /home/runner/work/_temp/ || true
          fi

      # Post status to issue #48. Combines Claude's one-liner with the
      # data-commit outcome from the earlier step.
      - name: Post status to tracking issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          BRIEF="$(cat /tmp/agent_status.txt 2>/dev/null || echo '(no brief status)')"
          COMMIT="$(cat /tmp/data_commit_status.txt 2>/dev/null || echo 'data_commit=unknown')"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "**portfolio-scaling** — ${STATUS}"
            echo "${BRIEF} ${COMMIT}"
            echo "[run]($RUN_URL)"
          } | gh issue comment 48 --repo "${{ github.repository }}" --body-file - || true
